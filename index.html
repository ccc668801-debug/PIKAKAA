<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pika 跨團總對帳中心</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--maca-yellow:#FFF2CC;--pika-brown:#5C4033;--bg-color:#FEF9EF;--btn-active:#F3A05F;--tax-red:#FFADAD;--check-green:#A8D5BA;--deduct-bg:#E8F5E9;--ship-purple:#E1D5E7;}
*{font-family:'Zen Maru Gothic',sans-serif !important;box-sizing:border-box;-webkit-font-smoothing:antialiased;font-weight:700;}
body{background:var(--bg-color);color:var(--pika-brown);margin:0;padding-bottom:90px;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.top-bar{background:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--maca-yellow);position:sticky;top:0;z-index:1000;width:100%;max-width:420px;}
.view-section{width:100%;max-width:420px;display:none;padding:0 10px;}
.active{display:block;}
.pika-header{font-size:1.4rem;color:var(--btn-active);text-align:center;margin:15px 0;}
.panel{background:#fff;padding:15px;border-radius:25px;border:3px solid var(--maca-yellow);margin-bottom:15px;box-shadow:0 4px 10px rgba(0,0,0,0.05);}
input,textarea,select,button{width:100%;padding:12px;margin:8px 0;border:2px solid #eee;border-radius:15px;font-size:1rem;outline:none;background:#fff;color:var(--pika-brown);}
.btn-main{background:var(--btn-active);border-radius:20px;border:none;color:white;cursor:pointer;font-size:1.1rem;margin-top:10px;box-shadow:0 4px 0 #d38446;}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #d38446;}
.group-card{margin-bottom:12px;border-radius:20px;border:2.5px solid var(--maca-yellow);background:#fff;overflow:hidden;}
.group-header{background:var(--maca-yellow);padding:12px 15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.group-content{display:none;padding:10px;background:#fff;}
.group-card.open .group-content{display:block;}
.item-row{display:flex;align-items:center;padding:10px;border-bottom:1px solid #eee;gap:8px;background:#fff;}
.check-circle{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.8rem;}
.is-checked{background:var(--check-green);border-color:var(--check-green);color:white;}
.ship-circle{width:24px;height:24px;border-radius:50%;border:2px solid #ddd;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.7rem;background:#f3e5f5;color:#8e24aa;}
.is-shipped{background:#8e24aa;border-color:#8e24aa;color:white;}
.btn-sm-action{width:auto !important;padding:4px 10px !important;margin:0 !important;border-radius:8px !important;font-size:0.75rem !important;cursor:pointer;border:1.5px solid #ddd !important;background:#f9f9f9 !important;color:#666 !important;}
.btn-copy{background:#f5f5f5;border:none;padding:6px 12px;border-radius:12px;font-size:0.85rem;color:#666;cursor:pointer;}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:420px;background:#fff;display:flex;justify-content:space-around;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:3px solid var(--maca-yellow);z-index:1000;}
.nav-item{font-size:.8rem;cursor:pointer;text-align:center;color:#aaa;flex:1;}
.nav-item.active{color:var(--btn-active);}
</style>
</head>
<body>

<div class="top-bar">
  <div style="font-size:0.9rem;font-weight:700;color:var(--pika-brown);">📦 跨團總對帳中心</div>
  <div style="font-size:0.75rem;color:#aaa;background:#f5f5f5;padding:3px 8px;border-radius:8px;">v3.0</div>
</div>

<!-- 分頁一：單團明細檢視 -->
<div id="tab1View" class="view-section active">
  <h2 class="pika-header">單團明細檢視</h2>
  <div class="panel">
    <label style="font-size:0.85rem;color:#666;">選擇要查看的代購團：</label>
    <select id="selectCampTab1" onchange="renderTab1()" style="margin-top:5px;"></select>
  </div>
  <div id="tab1Content"></div>
</div>

<!-- 分頁二：跨團總對帳與出貨 -->
<div id="tab2View" class="view-section">
  <h2 class="pika-header">跨團總對帳與出貨</h2>
  <div class="panel" style="padding:12px;">
    <input type="text" id="globalSearch" placeholder="🔍 搜尋買家姓名或商品名稱..." oninput="renderTab2()" style="margin:0;padding:10px;">
  </div>
  <div id="tab2Content"></div>
</div>

<!-- 分頁三：檔案上傳中心 -->
<div id="tab3View" class="view-section">
  <h2 class="pika-header">檔案上傳中心</h2>
  <div class="panel" style="text-align:center;padding:25px 15px;">
    <div style="font-size:2.5rem;margin-bottom:10px;">📤</div>
    <div style="font-size:0.9rem;color:#666;margin-bottom:15px;">請上傳各個代購團匯出的 .json 檔案</div>
    <button class="btn-main" onclick="document.getElementById('jsonFileInput').click()">選擇並上傳 JSON 檔案</button>
    <input type="file" id="jsonFileInput" accept=".json" multiple style="display:none" onchange="handleFilesUpload(this)">
  </div>
  <div class="panel">
    <div style="font-size:0.9rem;font-weight:700;margin-bottom:10px;">📋 已上傳的代購團列表：</div>
    <div id="uploadedCampList" style="display:flex;flex-direction:column;gap:8px;"></div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('tab1',this)"><div>📋</div><span>單團明細</span></div>
  <div class="nav-item" onclick="switchTab('tab2',this)"><div>⚖️</div><span>跨團對帳</span></div>
  <div class="nav-item" onclick="switchTab('tab3',this)"><div>📁</div><span>檔案上傳</span></div>
</nav>

<script>
let uploadedGroups = [];
let buyerStates = {}; // 記錄打包與出貨狀態 { "買家名_團名_商品ID": { packed: true, shipped: false } }

try {
  const saved = localStorage.getItem('pika_multigroup_data');
  if(saved) uploadedGroups = JSON.parse(saved);
  const savedStates = localStorage.getItem('pika_multigroup_states');
  if(savedStates) buyerStates = JSON.parse(savedStates);
} catch(e) {
  uploadedGroups = [];
}

window.onload = () => {
  updateCampDropdown();
  renderTab1();
  renderTab2();
  renderUploadedList();
};

function switchTab(tabId, el){
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.getElementById(tabId + 'View').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if(el) el.classList.add('active');
  if(tabId === 'tab1') renderTab1();
  if(tabId === 'tab2') renderTab2();
  if(tabId === 'tab3') renderUploadedList();
}

function handleFilesUpload(input){
  const files = input.files;
  if(!files || files.length === 0) return;
  
  let loadedCount = 0;
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if(data && data.groupName && Array.isArray(data.items)){
          // 檢查是否已存在同名團，若有則覆蓋更新
          const existingIndex = uploadedGroups.findIndex(g => g.groupName === data.groupName);
          if(existingIndex >= 0) {
            uploadedGroups[existingIndex] = data;
          } else {
            uploadedGroups.push(data);
          }
        }
        loadedCount++;
        if(loadedCount === files.length){
          saveData();
          updateCampDropdown();
          renderTab1();
          renderTab2();
          renderUploadedList();
          alert("✅ 檔案上傳與整合成功！");
          input.value = "";
        }
      } catch(err) {
        alert(`檔案 ${file.name} 格式錯誤！`);
      }
    };
    reader.readAsText(file);
  });
}

function saveData(){
  localStorage.setItem('pika_multigroup_data', JSON.stringify(uploadedGroups));
  localStorage.setItem('pika_multigroup_states', JSON.stringify(buyerStates));
}

function updateCampDropdown(){
  const select = document.getElementById('selectCampTab1');
  if(!select) return;
  if(uploadedGroups.length === 0){
    select.innerHTML = `<option value="">(尚未上傳任何代購團)</option>`;
    return;
  }
  select.innerHTML = uploadedGroups.map(g => `<option value="${g.groupName}">${g.groupName} (${g.items.length}項商品)</option>`).join('');
}

function renderTab1(){
  const container = document.getElementById('tab1Content');
  const select = document.getElementById('selectCampTab1');
  if(!container || !select) return;
  
  const campName = select.value;
  const group = uploadedGroups.find(g => g.groupName === campName);
  
  if(!group || !group.items || group.items.length === 0){
    container.innerHTML = `<div class="panel" style="text-align:center;color:#aaa;padding:20px;">請先至「檔案上傳」分頁上傳該團 JSON 檔案</div>`;
    return;
  }
  
  // 依照買家分組顯示
  const buyersMap = {};
  group.items.forEach(item => {
    const b = item.friend || '未分類';
    if(!buyersMap[b]) buyersMap[b] = [];
    buyersMap[b].push(item);
  });
  
  let html = '';
  for(let buyer in buyersMap){
    let itemsHtml = buyersMap[buyer].map(i => `
      <div class="item-row">
        <div style="flex:1;font-size:0.9rem;">${i.name} x ${i.qty || 1}</div>
        <div style="font-size:0.85rem;color:#b87c53;">${i.price * (i.qty || 1)}円</div>
      </div>
    `).join('');
    
    html += `
      <div class="group-card open">
        <div class="group-header" onclick="this.parentElement.classList.toggle('open')">
          <span style="font-weight:700;">👤 ${buyer}</span>
          <span style="font-size:0.8rem;color:#666;">共 ${buyersMap[buyer].length} 項 ▾</span>
        </div>
        <div class="group-content" style="display:block;">
          ${itemsHtml}
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function renderTab2(){
  const container = document.getElementById('tab2Content');
  const searchInput = document.getElementById('globalSearch');
  if(!container) return;
  
  const keyword = searchInput ? searchInput.value.toLowerCase().trim() : "";
  
  if(uploadedGroups.length === 0){
    container.innerHTML = `<div class="panel" style="text-align:center;color:#aaa;padding:20px;">目前沒有跨團資料，請先至「檔案上傳」分頁上傳檔案</div>`;
    return;
  }
  
  // 彙整所有買家跨團資料
  // structure: { "買家名": [ { groupName, item } ] }
  const allBuyers = {};
  uploadedGroups.forEach(group => {
    if(group.items){
      group.items.forEach(item => {
        const b = item.friend || '未分類';
        if(!allBuyers[b]) allBuyers[b] = [];
        allBuyers[b].push({ groupName: group.groupName, item: item });
      });
    }
  });
  
  let html = '';
  for(let buyer in allBuyers){
    let buyerItems = allBuyers[buyer];
    
    // 如果有關鍵字，過濾買家名字或商品名稱
    if(keyword){
      const matchBuyer = buyer.toLowerCase().includes(keyword);
      const matchItem = buyerItems.some(bi => bi.item.name.toLowerCase().includes(keyword));
      if(!matchBuyer && !matchItem) continue;
    }
    
    // 計算該買家跨團總金額
    let totalJPY = 0;
    let groupBreakdownHtml = '';
    
    // 依團別再細分
    const groupMap = {};
    buyerItems.forEach(bi => {
      if(!groupMap[bi.groupName]) groupMap[bi.groupName] = [];
      groupMap[bi.groupName].push(bi.item);
    });
    
    for(let gName in groupMap){
      let gItemsHtml = groupMap[gName].map(i => {
        let p = i.price * (i.qty || 1);
        totalJPY += p;
        return `<div style="font-size:0.85rem;color:#555;padding-left:10px;">• ${i.name} x ${i.qty || 1} (${p}円)</div>`;
      }).join('');
      
      groupBreakdownHtml += `
        <div style="margin:6px 0;font-size:0.9rem;font-weight:700;color:var(--btn-active);">📌 ${gName}</div>
        ${gItemsHtml}
      `;
    }
    
    html += `
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:2px solid var(--maca-yellow);padding-bottom:6px;">
          <span style="font-size:1.05rem;font-weight:700;">👤 ${buyer}</span>
          <button class="btn-copy" onclick="copyBuyerSummary('${buyer}')">📋 複製明細</button>
        </div>
        ${groupBreakdownHtml}
        <div style="margin-top:10px;text-align:right;font-size:0.95rem;color:#b87c53;font-weight:700;">
          跨團總計：${totalJPY} 円
        </div>
      </div>
    `;
  }
  
  container.innerHTML = html || `<div class="panel" style="text-align:center;color:#aaa;padding:20px;">找不到符合的買家或商品</div>`;
}

function renderUploadedList(){
  const listDiv = document.getElementById('uploadedCampList');
  if(!listDiv) return;
  if(uploadedGroups.length === 0){
    listDiv.innerHTML = `<div style="font-size:0.85rem;color:#aaa;">尚未上傳任何檔案</div>`;
    return;
  }
  listDiv.innerHTML = uploadedGroups.map((g, index) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f9f9f9;border-radius:12px;border:1px solid #eee;">
      <span style="font-size:0.9rem;">📦 ${g.groupName} (${g.items ? g.items.length : 0}項商品)</span>
      <button onclick="removeGroup(${index})" class="btn-sm-action" style="background:#ffadad !important;color:white !important;border:none !important;">刪除</button>
    </div>
  `).join('');
}

function removeGroup(index){
  if(confirm("確定要刪除這個已上傳的代購團嗎？")){
    uploadedGroups.splice(index, 1);
    saveData();
    updateCampDropdown();
    renderTab1();
    renderTab2();
    renderUploadedList();
  }
}

function copyBuyerSummary(buyerName){
  let text = `【${buyerName}】跨團代購明細：\n`;
  let total = 0;
  
  uploadedGroups.forEach(group => {
    if(group.items){
      let items = group.items.filter(i => i.friend === buyerName);
      if(items.length > 0){
        text += `\n[${group.groupName}]:\n`;
        items.forEach(i => {
          let p = i.price * (i.qty || 1);
          total += p;
          text += `- ${i.name} x ${i.qty || 1}：${p}円\n`;
        });
      }
    }
  });
  
  text += `\n------------------\n跨團總金額：${total} 円`;
  
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => alert(`已成功複製 ${buyerName} 的跨團明細！`));
  } else {
    alert("複製失敗，請手動複製。");
  }
}
</script>

</body>
</html>
