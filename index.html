<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PikaBuyer 買買清單</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'jf-openhuninn';
  src: url('https://cdn.jsdelivr.net/gh/justfont/open-huninn-font@master/font/jf-openhuninn-2.0.woff2') format('woff2');
  font-weight: normal;
  font-style: normal;
}
:root {
  --maca-yellow: #FDF0C2;
  --card-header: #FDEEB8;
  --pika-brown: #4A3728;
  --bg-color: #FEFBF3;
  --btn-active: #F2A359;
  --btn-green: #CAE9E0;
}
* {
  font-family: 'jf-openhuninn', 'Zen Maru Gothic', 'PingFang TC', 'Microsoft JhengHei', sans-serif !important;
  box-sizing: border-box;
  letter-spacing: 0.03em;
}
body {
  background: var(--bg-color);
  color: var(--pika-brown);
  margin: 0;
  padding-bottom: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
}
.top-bar {
  background: #fff;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--maca-yellow);
  position: sticky;
  top: 0;
  z-index: 1000;
  width: 100%;
  max-width: 420px;
}
.user-info {
  color: #E67E22;
  font-size: 1.05rem;
  font-weight: 700;
}
.pika-header {
  font-size: 1.55rem;
  font-weight: 700;
  color: var(--btn-active);
  text-align: center;
  margin: 18px 0 14px;
}
.view-section {
  width: 100%;
  max-width: 420px;
  display: none;
  padding: 0 12px;
}
.active {
  display: block;
}
.panel {
  background: #fff;
  padding: 18px 16px;
  border-radius: 22px;
  border: 2.5px solid var(--maca-yellow);
  margin-bottom: 15px;
  box-shadow: 0 4px 12px rgba(92, 64, 51, 0.04);
}
input {
  width: 100%;
  padding: 12px 14px;
  margin: 6px 0;
  border: 2px solid #EFEAE1;
  border-radius: 14px;
  font-size: 0.98rem;
  color: var(--pika-brown);
  background: #FFFEFA;
  outline: none;
}
input:focus {
  border-color: var(--btn-active);
  background: #fff;
}
.btn-main {
  width: 100%;
  padding: 13px;
  background: var(--btn-active);
  border-radius: 18px;
  margin-top: 12px;
  border: none;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  font-size: 1.02rem;
}
.btn-outline {
  width: 100%;
  padding: 11px;
  background: #FFF9E8;
  border: 1.5px solid #F5DFA3;
  border-radius: 14px;
  margin-top: 10px;
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--pika-brown);
  font-weight: 700;
}
.toast-msg {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(74, 55, 40, 0.85);
  color: #fff;
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 0.95rem;
  z-index: 9999;
  display: none;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

/* 買家卡片樣式 */
.buyer-card {
  background: #fff;
  border-radius: 20px;
  margin-bottom: 14px;
  border: 2px solid var(--maca-yellow);
  box-shadow: 0 3px 10px rgba(92, 64, 51, 0.04);
  overflow: hidden;
}
.buyer-header {
  background: var(--card-header);
  padding: 13px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.buyer-title-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.buyer-name {
  font-size: 1.08rem;
  font-weight: 700;
  color: var(--pika-brown);
  word-break: break-all;
}
.buyer-count {
  background: #fff;
  color: #D9822B;
  font-size: 0.78rem;
  padding: 2px 9px;
  border-radius: 10px;
  font-weight: 700;
  flex-shrink: 0;
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.mini-btn {
  background: #fff;
  border: 1.5px solid #EBD9A8;
  border-radius: 10px;
  padding: 5px 10px;
  font-size: 0.8rem;
  color: var(--pika-brown);
  cursor: pointer;
  font-weight: 700;
}
.buyer-body {
  display: none;
  padding: 8px 10px 10px;
  background: #fff;
}
.open .buyer-body {
  display: block;
}

/* 商品列 */
.item-row-buyer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 10px;
  margin-bottom: 6px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid #F5F1E8;
  transition: background-color 0.2s ease;
  gap: 8px;
  width: 100%;
}
.item-row-buyer:last-child {
  margin-bottom: 0;
}
.item-row-buyer.status-bought {
  background: #E2F5EB;
  border-color: #BDE3CF;
}
.item-row-buyer.status-unbought {
  background: #FDE8E8;
  border-color: #F7C6C6;
}
.item-row-buyer.status-packed {
  background: #EFE6FA;
  border-color: #D8C4F2;
}

.item-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.item-name-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  overflow: hidden;
}
.item-text {
  color: var(--pika-brown);
  font-weight: 700;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-note {
  color: #8C7E72;
  font-size: 0.8rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-left: 20px;
}

/* 右側符號按鈕區塊 */
.status-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
  align-items: center;
}
.status-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
  border-radius: 8px;
  border: 1px solid #E5DFD5;
  background: rgba(255, 255, 255, 0.9);
  color: var(--pika-brown);
  cursor: pointer;
  font-weight: 700;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.status-btn:active {
  transform: scale(0.92);
}
.status-btn.active-bought {
  background: #38A169;
  color: #fff;
  border-color: #38A169;
}
.status-btn.active-unbought {
  background: #E53E3E;
  color: #fff;
  border-color: #E53E3E;
}
.status-btn.active-packed {
  background: #805AD5;
  color: #fff;
  border-color: #805AD5;
}
.status-btn.btn-reset {
  color: #8C7E72;
  background: #F9F7F3;
  font-size: 0.75rem;
}

.del-x {
  color: #B5A99E;
  cursor: pointer;
  font-size: 1rem;
  padding: 2px 4px;
  flex-shrink: 0;
}
.del-x:hover {
  color: #E74C3C;
}

/* 底部導覽列 */
.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 420px;
  background: #fff;
  display: flex;
  justify-content: space-around;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  border-top: 2.5px solid var(--maca-yellow);
  z-index: 1000;
}
.nav-item {
  font-size: 0.82rem;
  cursor: pointer;
  text-align: center;
  color: #9A8C80;
  flex: 1;
  font-weight: 700;
}
.nav-item div {
  font-size: 1.25rem;
  margin-bottom: 2px;
}
.nav-item.active {
  color: var(--btn-active);
}
.empty-tip {
  text-align: center;
  color: #A89B8E;
  padding: 36px 15px;
  font-size: 0.95rem;
}
</style>
</head>
<body>

<div id="toastMessage" class="toast-msg">登記成功</div>

<div id="appInterface" style="width:100%;max-width:420px">
  <div class="top-bar">
    <div class="user-info">PikaBuyer 登記簿</div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="font-size:0.75rem;color:#A08C7D;">v3.7</span>
    </div>
  </div>

  <!-- 分頁 1：輸入 -->
  <div id="inputView" class="view-section active">
    <h2 class="pika-header">登記喊單</h2>
    <div class="panel">
      <input type="text" id="buyerName" placeholder="買家名字">
      <input type="text" id="itemName" placeholder="商品名稱">
      <input type="text" id="itemNote" placeholder="備註（例如：金額、尺寸、款式等，可不填）" onkeydown="if(event.key==='Enter') addOrder()">
      <button class="btn-main" onclick="addOrder()">新增登記</button>
      <button class="btn-outline" onclick="quickFillBuyer()">帶入上一位買家繼續新增</button>
    </div>
  </div>

  <!-- 分頁 2：清單 -->
  <div id="listView" class="view-section">
    <h2 class="pika-header">買買清單</h2>
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button class="mini-btn" onclick="exportAllText()" style="background:var(--btn-green);border:none;padding:7px 12px;">複製全部清單</button>
    </div>
    <div id="buyerListContainer"></div>
  </div>

  <!-- 分頁 3：搜尋 -->
  <div id="searchView" class="view-section">
    <h2 class="pika-header">查詢喊單</h2>
    <div class="panel" style="padding:12px;">
      <input type="text" id="filterKeyword" placeholder="輸入買家名字或商品任一字..." oninput="renderSearch()" style="margin:0;">
    </div>
    <div id="searchResultContainer"></div>
  </div>

  <!-- 底部三個分頁導覽列 -->
  <nav class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('input',this)"><div>＋</div><span>輸入</span></div>
    <div class="nav-item" onclick="switchTab('list',this)"><div>📋</div><span>清單</span></div>
    <div class="nav-item" onclick="switchTab('search',this)"><div>🔍</div><span>搜尋</span></div>
  </nav>
</div>

<script>
let buyersData = JSON.parse(localStorage.getItem('pika_buyers_v3')) || {};
let openedBuyers = new Set();
let lastBuyerName = "";

function showToast(msg = "登記成功") {
  const t = document.getElementById('toastMessage');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 1400);
}

function switchTab(tabName, el) {
  document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  
  document.getElementById(tabName + 'View').classList.add('active');
  el.classList.add('active');
  
  if (tabName === 'list') {
    renderList();
  } else if (tabName === 'search') {
    renderSearch();
    setTimeout(() => document.getElementById('filterKeyword').focus(), 100);
  }
}

function quickFillBuyer() {
  if (lastBuyerName) {
    document.getElementById('buyerName').value = lastBuyerName;
    document.getElementById('itemName').focus();
    showToast(`已帶入：${lastBuyerName}`);
  } else {
    alert("目前還沒有上一位買家紀錄");
  }
}

function addOrder() {
  const nameInput = document.getElementById('buyerName');
  const itemInput = document.getElementById('itemName');
  const noteInput = document.getElementById('itemNote');
  
  const buyer = nameInput.value.trim();
  const item = itemInput.value.trim();
  const note = noteInput.value.trim();

  if (!buyer) return alert("請輸入買家名字！");
  if (!item) return alert("請輸入商品名稱！");

  lastBuyerName = buyer;

  if (!buyersData[buyer]) {
    buyersData[buyer] = [];
  }

  buyersData[buyer].push({
    id: Date.now() + Math.random(),
    name: item,
    note: note,
    status: ""
  });

  itemInput.value = "";
  noteInput.value = "";
  itemInput.focus();

  saveData();
  showToast(`已登記：${buyer}`);
}

function saveData() {
  localStorage.setItem('pika_buyers_v3', JSON.stringify(buyersData));
}

function setItemStatus(buyerName, itemId, newStatus, mode) {
  const items = buyersData[buyerName];
  if (!items) return;
  const target = items.find(i => i.id === itemId);
  if (target) {
    target.status = newStatus;
    saveData();
    if (mode === 'search') renderSearch();
    else renderList();
  }
}

function editItem(buyerName, itemId, mode) {
  const items = buyersData[buyerName];
  if (!items) return;
  const target = items.find(i => i.id === itemId);
  if (!target) return;

  const newName = prompt("修改商品名稱：", target.name);
  if (newName === null) return;

  const trimmedName = newName.trim();
  if (!trimmedName) return alert("商品名稱不能為空！");

  const newNote = prompt("修改或新增備註：", target.note || "");
  if (newNote === null) return;

  target.name = trimmedName;
  target.note = newNote.trim();

  saveData();
  showToast("修改成功");
  if (mode === 'search') renderSearch();
  else renderList();
}

function toggleBuyer(buyerName, cardEl) {
  if (openedBuyers.has(buyerName)) {
    openedBuyers.delete(buyerName);
    cardEl.classList.remove('open');
  } else {
    openedBuyers.add(buyerName);
    cardEl.classList.add('open');
  }
}

function deleteItem(buyerName, itemId, mode) {
  if (confirm("確定刪除這項商品？")) {
    buyersData[buyerName] = buyersData[buyerName].filter(i => i.id !== itemId);
    if (buyersData[buyerName].length === 0) {
      delete buyersData[buyerName];
      openedBuyers.delete(buyerName);
    }
    saveData();
    if (mode === 'search') renderSearch();
    else renderList();
  }
}

function deleteBuyerGroup(buyerName, mode) {
  if (confirm(`確定要刪除「${buyerName}」的所有登記嗎？`)) {
    delete buyersData[buyerName];
    openedBuyers.delete(buyerName);
    saveData();
    if (mode === 'search') renderSearch();
    else renderList();
  }
}

function copySingleBuyer(buyerName) {
  const items = buyersData[buyerName] || [];
  let text = `${buyerName}：\n`;
  items.forEach((i, idx) => {
    let line = `${idx + 1}. ${i.name}`;
    if (i.note) line += ` (${i.note})`;
    text += `${line}\n`;
  });
  navigator.clipboard.writeText(text.trim()).then(() => {
    showToast(`已複製 ${buyerName} 的清單`);
  });
}

function exportAllText() {
  const entries = Object.entries(buyersData);
  if (entries.length === 0) return alert("目前清單是空的");
  let text = "【買買清單】\n";
  entries.forEach(([buyer, items]) => {
    text += `\n${buyer}：\n`;
    items.forEach((i, idx) => {
      let line = `  ${idx + 1}. ${i.name}`;
      if (i.note) line += ` (${i.note})`;
      text += `${line}\n`;
    });
  });
  navigator.clipboard.writeText(text.trim()).then(() => {
    showToast("已複製全部清單");
  });
}

function createBuyerCard(buyer, items, isOpen, mode) {
  const card = document.createElement('div');
  card.className = `buyer-card ${isOpen ? 'open' : ''}`;
  const safeBuyer = buyer.replace(/'/g, "\\'");

  const itemsHtml = items.map(i => {
    const st = i.status || '';
    const rowClass = st ? `status-${st}` : '';
    const noteHtml = i.note ? `<div class="item-note">備註：${i.note}</div>` : '';
    return `
      <div class="item-row-buyer ${rowClass}">
        <div class="item-left">
          <div class="item-name-wrap">
            <span class="del-x" onclick="deleteItem('${safeBuyer}', ${i.id}, '${mode}')" title="刪除">✕</span>
            <span class="status-btn" onclick="editItem('${safeBuyer}', ${i.id}, '${mode}')" title="編輯商品與備註" style="background:#FFF9E8;font-size:0.75rem;">✏️</span>
            <span class="item-text" title="${i.name}">${i.name}</span>
          </div>
          ${noteHtml}
        </div>
        <div class="status-actions">
          <button class="status-btn ${st === 'bought' ? 'active-bought' : ''}" onclick="setItemStatus('${safeBuyer}', ${i.id}, 'bought', '${mode}')" title="已買到">✓</button>
          <button class="status-btn ${st === 'unbought' ? 'active-unbought' : ''}" onclick="setItemStatus('${safeBuyer}', ${i.id}, 'unbought', '${mode}')" title="未買到">✕</button>
          <button class="status-btn ${st === 'packed' ? 'active-packed' : ''}" onclick="setItemStatus('${safeBuyer}', ${i.id}, 'packed', '${mode}')" title="已打包">📦</button>
          <button class="status-btn btn-reset" onclick="setItemStatus('${safeBuyer}', ${i.id}, '', '${mode}')" title="重製">⟳</button>
        </div>
      </div>
    `;
  }).join('');

  card.innerHTML = `
    <div class="buyer-header" onclick="toggleBuyer('${safeBuyer}', this.parentElement)">
      <div class="buyer-title-wrap">
        <span class="buyer-name">${buyer}</span>
        <span class="buyer-count">${items.length} 件</span>
      </div>
      <div class="header-actions" onclick="event.stopPropagation()">
        <button class="mini-btn" onclick="copySingleBuyer('${safeBuyer}')">複製</button>
        <button class="mini-btn" onclick="deleteBuyerGroup('${safeBuyer}', '${mode}')" style="color:#D9534F;">刪除</button>
      </div>
    </div>
    <div class="buyer-body">
      ${itemsHtml}
    </div>
  `;
  return card;
}

function renderList() {
  const container = document.getElementById('buyerListContainer');
  container.innerHTML = "";
  const entries = Object.entries(buyersData);
  
  if (entries.length === 0) {
    container.innerHTML = `<div class="empty-tip">目前還沒有任何登記紀錄</div>`;
    return;
  }

  entries.forEach(([buyer, items]) => {
    const isOpen = openedBuyers.has(buyer);
    container.appendChild(createBuyerCard(buyer, items, isOpen, 'list'));
  });
}

function renderSearch() {
  const container = document.getElementById('searchResultContainer');
  container.innerHTML = "";
  const keyword = (document.getElementById('filterKeyword').value || "").toLowerCase().trim();

  if (!keyword) {
    container.innerHTML = `<div class="empty-tip">請在上方輸入買家名字或商品任一字進行查詢</div>`;
    return;
  }

  const entries = Object.entries(buyersData);
  let matchCount = 0;

  entries.forEach(([buyer, items]) => {
    const matchBuyer = buyer.toLowerCase().includes(keyword);
    const matchedItems = items.items ? items.items : items.filter(i => i.name.toLowerCase().includes(keyword) || (i.note && i.note.toLowerCase().includes(keyword)));

    // 修正搜尋條件檢查
    const matched = items.filter(i => i.name.toLowerCase().includes(keyword) || (i.note && i.note.toLowerCase().includes(keyword)));

    if (matchBuyer) {
      matchCount++;
      container.appendChild(createBuyerCard(buyer, items, true, 'search'));
    } else if (matched.length > 0) {
      matchCount++;
      container.appendChild(createBuyerCard(buyer, matched, true, 'search'));
    }
  });

  if (matchCount === 0) {
    container.innerHTML = `<div class="empty-tip">找不到包含「${keyword}」的買家或商品/備註</div>`;
  }
}

window.onload = function() {
  renderList();
};
</script>

</body>
</html>
