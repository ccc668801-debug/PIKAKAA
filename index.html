<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokepeace 跨團總對帳與出貨整合工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pika: {
              bg: '#FFFDF2',
              card: '#FFFFFF',
              nav: '#FFEAEB',
              navBorder: '#FFC1C5',
              border: '#FFE8C8',
              accent: '#FF7E67',
              accentHover: '#FF6B52',
              yellow: '#FFF3B8',
              yellowDark: '#F7C948',
              textMain: '#4A3728',
              textSub: '#8C7361',
              pinkBtn: '#FFDEE2',
              blueTag: '#E0F7FC',
              blueText: '#0083B0'
            }
          },
          fontFamily: {
            title: ['Bubblegum Sans', 'Fredoka', 'M PLUS Rounded 1c', 'sans-serif'],
            body: ['M PLUS Rounded 1c', 'Zen Maru Gothic', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FFFDF2;
      color: #4A3728;
      font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
    }
    .font-title-style {
      font-family: 'Bubblegum Sans', 'Fredoka', 'M PLUS Rounded 1c', sans-serif;
    }
    .pika-shadow {
      box-shadow: 0 4px 0px #F3D0A8;
    }
    .pika-btn-shadow {
      box-shadow: 0 3px 0px #E59885;
    }
    .pika-btn-shadow:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0px #E59885;
    }
    .pika-card-border {
      border: 2px solid #FFE8C8;
    }
  </style>
</head>
<body class="min-h-screen pb-10">

  <header class="bg-[#FFEAEB] border-b-2 border-[#FFC1C5] sticky top-0 z-50 px-3 py-2.5 shadow-sm">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xl">⚡</span>
        <h1 class="text-lg md:text-xl font-bold font-title-style text-[#FF7E67] tracking-wider leading-none">
          Pokepeace 跨團總對帳
        </h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="loadedGroupsBadge" class="bg-white text-pika-textMain font-bold text-xs px-2.5 py-1 rounded-xl border border-[#FFC1C5]">
          尚未匯入檔案
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 mt-4 space-y-4">

    <!-- 檔案上傳區 -->
    <div class="bg-white rounded-2xl p-4 pika-card-border pika-shadow space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#FFE8C8] pb-2.5">
        <div>
          <h2 class="text-base md:text-lg font-bold text-pika-textMain flex items-center gap-1.5">
            <i data-lucide="folder-plus" class="w-5 h-5 text-pika-accent"></i>
            上傳各團匯出的 .json 檔案
          </h2>
          <p class="text-[11px] text-pika-textSub mt-0.5">可一次複選多個檔案（第1團、第2團、第3團），系統會自動依買家姓名合併所有卡片與金額！</p>
        </div>
        <div class="flex items-center gap-1.5">
          <label class="text-xs font-bold text-pika-textSub">單張金額 $</label>
          <input type="number" id="unitPriceInput" value="55" onchange="renderMergedResult()" class="w-16 px-2 py-1 rounded-lg border-2 border-[#FFE8C8] bg-[#FFFDF2] font-bold text-xs text-center outline-none focus:border-[#FF7E67]">
        </div>
      </div>

      <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-[#FFC1C5] border-dashed rounded-2xl cursor-pointer bg-[#FFFDF2] hover:bg-[#FFEAEB]/40 transition-all">
        <div class="flex flex-col items-center justify-center py-4">
          <i data-lucide="upload-cloud" class="w-7 h-7 text-pika-accent mb-1"></i>
          <p class="text-xs sm:text-sm font-bold text-pika-accent">點擊選取多個團的 .json 檔案（可一次全選）</p>
          <p class="text-[11px] text-pika-textSub mt-0.5">支援同時匯入已分配開卡紀錄與原始喊單明細</p>
        </div>
        <input id="fileInput" type="file" accept=".json" multiple class="hidden" onchange="handleFiles(this.files)">
      </label>

      <div id="groupTagsContainer" class="flex flex-wrap gap-1.5"></div>
    </div>

    <!-- 篩選與顯示切換 -->
    <div id="controlBar" class="hidden bg-white rounded-2xl p-3.5 pika-card-border pika-shadow flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 bg-[#FFFDF2] p-1 rounded-xl border border-[#FFE8C8]">
        <button id="modeAllocatedBtn" onclick="setViewMode('allocated')" class="px-3 py-1 rounded-lg text-xs font-bold bg-[#FF7E67] text-white transition-all">
          🎉 已分到卡片總覽（出貨用）
        </button>
        <button id="modeOrderedBtn" onclick="setViewMode('ordered')" class="px-3 py-1 rounded-lg text-xs font-bold text-pika-textMain hover:bg-[#FFF3B8] transition-all">
          📝 原始喊單總覽（排單用）
        </button>
      </div>

      <div class="flex items-center gap-2">
        <div class="relative flex items-center">
          <i data-lucide="search" class="w-3.5 h-3.5 text-pika-textSub absolute left-2 pointer-events-none"></i>
          <input type="text" id="searchInput" oninput="renderMergedResult()" placeholder="搜尋買家姓名..." class="pl-7 pr-2.5 py-1 text-xs font-bold rounded-lg border border-[#FFE8C8] bg-[#FFFDF2] focus:bg-white focus:border-[#FF7E67] outline-none w-40 sm:w-48">
        </div>
        <span id="buyerCountBadge" class="bg-[#FFF3B8] text-pika-textMain font-bold text-xs px-2.5 py-1 rounded-full border border-[#F7C948]">
          共 0 位
        </span>
      </div>
    </div>

    <!-- 整合結果列表 -->
    <div id="resultGrid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

  </main>

  <script>
    let loadedGroups = [];
    let viewMode = 'allocated';
    let mergedStates = JSON.parse(localStorage.getItem('poke_merged_states')) || {};

    window.onload = () => {
      lucide.createIcons();
    };

    function saveMergedStates() {
      localStorage.setItem('poke_merged_states', JSON.stringify(mergedStates));
    }

    function setViewMode(mode) {
      viewMode = mode;
      const btnAlloc = document.getElementById('modeAllocatedBtn');
      const btnOrder = document.getElementById('modeOrderedBtn');
      if (mode === 'allocated') {
        btnAlloc.className = "px-3 py-1 rounded-lg text-xs font-bold bg-[#FF7E67] text-white transition-all";
        btnOrder.className = "px-3 py-1 rounded-lg text-xs font-bold text-pika-textMain hover:bg-[#FFF3B8] transition-all";
      } else {
        btnOrder.className = "px-3 py-1 rounded-lg text-xs font-bold bg-[#FF7E67] text-white transition-all";
        btnAlloc.className = "px-3 py-1 rounded-lg text-xs font-bold text-pika-textMain hover:bg-[#FFF3B8] transition-all";
      }
      renderMergedResult();
    }

    async function handleFiles(files) {
      if (!files.length) return;
      loadedGroups = [];

      for (let file of files) {
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          const fallbackName = file.name.replace(/\.json$/i, '');
          loadedGroups.push({
            groupName: data.groupName || fallbackName,
            buyersData: Array.isArray(data.buyersData) ? data.buyersData : [],
            matchRecords: Array.isArray(data.matchRecords) ? data.matchRecords : [],
            buyerStates: data.buyerStates || {}
          });
        } catch (err) {
          alert(`讀取「${file.name}」失敗，請確認這是由代購網頁匯出的 .json 檔案！`);
        }
      }

      document.getElementById('loadedGroupsBadge').innerText = `已匯入 ${loadedGroups.length} 個團`;
      document.getElementById('controlBar').classList.remove('hidden');

      const tagsContainer = document.getElementById('groupTagsContainer');
      tagsContainer.innerHTML = loadedGroups.map(g => `
        <span class="px-2.5 py-1 rounded-lg bg-[#E0F7FC] text-pika-blueText font-bold text-xs border border-[#A5E3F3]">
          📁 ${g.groupName}（${g.buyersData.length}位買家 / 已配${g.matchRecords.length}張）
        </span>
      `).join('');

      renderMergedResult();
    }

    function normalizeName(name) {
      return (name || '').trim();
    }

    function toggleMergedNotified(buyerName) {
      if (!mergedStates[buyerName]) mergedStates[buyerName] = {};
      mergedStates[buyerName].notified = !mergedStates[buyerName].notified;
      saveMergedStates();
      renderMergedResult();
    }

    function toggleMergedPacked(buyerName) {
      if (!mergedStates[buyerName]) mergedStates[buyerName] = {};
      mergedStates[buyerName].packed = !mergedStates[buyerName].packed;
      saveMergedStates();
      renderMergedResult();
    }

    function copyMergedNotice(buyerName, noticeText, btnEl) {
      navigator.clipboard.writeText(noticeText).then(() => {
        const orig = btnEl.innerHTML;
        btnEl.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i><span>已複製！</span>`;
        btnEl.classList.remove('bg-[#FFDEE2]', 'text-pika-accent');
        btnEl.classList.add('bg-green-100', 'text-green-600');
        lucide.createIcons();
        setTimeout(() => {
          btnEl.innerHTML = orig;
          btnEl.classList.remove('bg-green-100', 'text-green-600');
          btnEl.classList.add('bg-[#FFDEE2]', 'text-pika-accent');
          lucide.createIcons();
        }, 1500);
      }).catch(() => {
        alert('複製失敗，請手動複製：\n' + noticeText);
      });
    }

    function renderMergedResult() {
      const grid = document.getElementById('resultGrid');
      const keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const unitPrice = Number(document.getElementById('unitPriceInput').value) || 55;

      if (viewMode === 'allocated') {
        const buyerMap = {};

        loadedGroups.forEach(group => {
          group.matchRecords.forEach(rec => {
            const bName = normalizeName(rec.buyerName);
            if (!bName || bName === '自留 / 可釋出') return;

            if (!buyerMap[bName]) {
              buyerMap[bName] = {
                buyerName: bName,
                groups: {},
                totalCards: 0
              };
            }
            if (!buyerMap[bName].groups[group.groupName]) {
              buyerMap[bName].groups[group.groupName] = {};
            }
            const cardKey = `${rec.zone}區${rec.role}`;
            buyerMap[bName].groups[group.groupName][cardKey] = (buyerMap[bName].groups[group.groupName][cardKey] || 0) + 1;
            buyerMap[bName].totalCards += 1;
          });
        });

        let list = Object.values(buyerMap);
        if (keyword) {
          list = list.filter(b => b.buyerName.toLowerCase().includes(keyword));
        }

        document.getElementById('buyerCountBadge').innerText = `共 ${list.length} 位有分到卡`;

        if (list.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-8 bg-white rounded-2xl pika-card-border text-xs text-pika-textSub">目前匯入的檔案中沒有已分配卡片的買家紀錄（可切換到「原始喊單總覽」查看登記內容）</div>`;
          return;
        }

        grid.innerHTML = list.map(b => {
          const totalPrice = b.totalCards * unitPrice;
          const state = mergedStates[b.buyerName] || {};
          const isNotified = !!state.notified;
          const isPacked = !!state.packed;

          const bgStyle = isPacked ? 'bg-[#EBF8FF] border-[#BEE3F8]' : 'bg-white border-[#FFE8C8]';
          const opacityStyle = isNotified ? 'opacity-45' : 'opacity-100';

          const groupTexts = Object.entries(b.groups).map(([gName, cardsObj]) => {
            const itemsStr = Object.entries(cardsObj).map(([cName, cnt]) => `${cName}${cnt}張`).join('、');
            return `【${gName}】${itemsStr}`;
          });
          const noticeText = `你好 卡片有排單到 ${groupTexts.join('；')} ，共計 ${b.totalCards} 張（${totalPrice}元），晚點會給你賣貨便下單~`;

          return `
            <div class="${bgStyle} ${opacityStyle} rounded-2xl p-4 border-2 pika-shadow flex flex-col justify-between space-y-3 transition-all">
              <div class="space-y-2.5">
                <div class="flex items-center justify-between border-b border-[#FFE8C8] pb-2">
                  <div class="flex items-center gap-2">
                    <span class="bg-[#FF7E67] text-white font-bold text-xs px-2 py-0.5 rounded-lg">
                      跨 ${Object.keys(b.groups).length} 團
                    </span>
                    <h3 class="font-bold text-pika-textMain text-base">${b.buyerName}</h3>
                  </div>
                  <span class="font-extrabold text-pika-accent text-sm">
                    共 ${b.totalCards} 張 ($${totalPrice})
                  </span>
                </div>

                <div class="space-y-2">
                  ${Object.entries(b.groups).map(([gName, cardsObj]) => `
                    <div class="bg-[#FFFDF2] p-2.5 rounded-xl border border-[#FFE8C8]">
                      <span class="text-[11px] font-bold text-pika-blueText block mb-1">📁 ${gName}</span>
                      <div class="flex flex-wrap gap-1">
                        ${Object.entries(cardsObj).map(([cName, cnt]) => `
                          <span class="px-2 py-0.5 rounded-md bg-white border border-[#FFE8C8] text-xs font-bold text-pika-textMain">
                            ${cName} <span class="text-pika-accent font-extrabold">x${cnt}</span>
                          </span>
                        `).join('')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="pt-2 border-t border-[#FFE8C8] flex items-center justify-end gap-1.5">
                <button onclick="toggleMergedNotified('${b.buyerName.replace(/'/g, "\\'")}')" class="p-1.5 rounded-lg border text-xs font-bold flex items-center gap-1 transition-all ${isNotified ? 'bg-gray-200 text-gray-700 border-gray-300' : 'bg-white hover:bg-gray-50 text-gray-500 border-[#FFE8C8]'}">
                  <i data-lucide="${isNotified ? 'check-square' : 'square'}" class="w-3.5 h-3.5 ${isNotified ? 'text-green-600' : ''}"></i>
                  <span>${isNotified ? '已通知' : '通知'}</span>
                </button>
                <button onclick="toggleMergedPacked('${b.buyerName.replace(/'/g, "\\'")}')" class="px-2.5 py-1.5 rounded-lg border text-xs font-bold flex items-center gap-1 transition-all ${isPacked ? 'bg-[#3182CE] text-white border-[#2B6CB0]' : 'bg-white hover:bg-blue-50 text-[#3182CE] border-[#BEE3F8]'}">
                  <i data-lucide="package-check" class="w-3.5 h-3.5"></i>
                  <span>${isPacked ? '已打包' : '打包'}</span>
                </button>
                <button onclick='copyMergedNotice(${JSON.stringify(b.buyerName)}, ${JSON.stringify(noticeText)}, this)' class="bg-[#FFDEE2] hover:bg-[#FFC1C5] text-pika-accent font-bold px-3 py-1.5 rounded-lg text-xs border border-[#FFB0B5] flex items-center gap-1 transition-all">
                  <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                  <span>複製通知</span>
                </button>
              </div>
            </div>
          `;
        }).join('');

      } else {
        const orderMap = {};
        loadedGroups.forEach(group => {
          group.buyersData.forEach(b => {
            const bName = normalizeName(b.name);
            if (!bName) return;
            if (!orderMap[bName]) {
              orderMap[bName] = {
                buyerName: bName,
                entries: []
              };
            }
            orderMap[bName].entries.push({
              groupName: group.groupName,
              orderNo: b.orderNo,
              content: b.content
            });
          });
        });

        let list = Object.values(orderMap);
        if (keyword) {
          list = list.filter(b => b.buyerName.toLowerCase().includes(keyword));
        }

        document.getElementById('buyerCountBadge').innerText = `共 ${list.length} 位登記買家`;

        if (list.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-8 bg-white rounded-2xl pika-card-border text-xs text-pika-textSub">沒有符合的買家喊單資料</div>`;
          return;
        }

        grid.innerHTML = list.map(b => `
          <div class="bg-white rounded-2xl p-4 border-2 border-[#FFE8C8] pika-shadow space-y-2.5">
            <div class="flex items-center justify-between border-b border-[#FFE8C8] pb-2">
              <h3 class="font-bold text-pika-textMain text-base">👤 ${b.buyerName}</h3>
              <span class="bg-[#FFF3B8] text-pika-textMain font-bold text-xs px-2.5 py-0.5 rounded-full border border-[#F7C948]">
                參加 ${b.entries.length} 個團
              </span>
            </div>
            <div class="space-y-2">
              ${b.entries.map(e => `
                <div class="bg-[#FFFDF2] p-2.5 rounded-xl border border-[#FFE8C8]">
                  <div class="flex items-center justify-between mb-1">
                    <span class="text-[11px] font-bold text-pika-accent">📁 ${e.groupName}</span>
                    <span class="text-[11px] font-bold text-pika-textSub">留言順序 #${e.orderNo}</span>
                  </div>
                  <p class="text-xs font-bold text-pika-textMain">${e.content}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `).join('');
      }

      lucide.createIcons();
    }
  </script>
</body>
</html>
